[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metacrafter"
version = "0.0.6"
description = "Metacrafter metadata classification tool"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Ivan Begtin", email = "ivan@begtin.tech" },
]
keywords = ["json", "jsonl", "csv", "bson", "cli", "dataset", "metadata", "pii", "semantic-types"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Software Development",
    "Topic :: Text Processing",
    "Topic :: Utilities",
]

# Core runtime dependencies: file and SQL scanning with rule-based classification.
# metacrafter-rules provides the default rule pack. It is not on PyPI yet; install it
# from GitHub first (see ecosystem.lock and the installation docs).
dependencies = [
    "metacrafter-rules>=0.0.2",
    "pyparsing>=3.1",
    "phonenumbers",
    "qddate",
    "orjson",
    "PyYAML>=6.0",
    "sqlalchemy>=2.0",
    "validators",
    "typer",
    "tabulate",
    "rich",
    "pydantic>=2.0",
    "xmltodict",
    "iterabledata>=1.1",
    "tqdm",
    "requests>=2.28.0",
    "chardet",
    "jsonschema>=4.18",
]

[project.optional-dependencies]
# Kept for backward compatibility: metacrafter-rules is now a core dependency.
rules = []
# Registry package: identify/match/checksums/crosswalks and a bundled snapshot.
# Not on PyPI yet; install it from GitHub (see ecosystem.lock). Without it,
# metacrafter reads the published /api/v1/ snapshot directly.
registry = ["metacrafter-registry>=1.3.0.dev0"]
# Binary, compressed and XML file formats handled by iterabledata.
formats = [
    "pyarrow>=10.0",
    "pyorc",
    "xlrd>=2.0",
    "openpyxl>=3.0",
    "lxml>=4.9",
    "lz4",
    "zstandard",
    "brotli",
    "brotli_file",
]
# MongoDB scanning (`metacrafter scan mongodb`).
mongodb = ["pymongo>=4.6"]
# Native DuckDB scanning and duckdb:// SQLAlchemy URLs.
duckdb = ["duckdb>=0.9", "duckdb-engine>=0.9"]
# HTTP API server (`metacrafter server run`), FastAPI with OpenAPI.
server = ["fastapi>=0.110", "uvicorn>=0.29"]
# MCP server for AI agents (`metacrafter mcp`).
mcp = ["mcp>=2.0,<3"]
# LLM classification. OpenAI-compatible providers (OpenAI, OpenRouter, Perplexity,
# Ollama, LM Studio) need no extra package; the Anthropic provider uses the SDK.
llm = [
    "anthropic>=2.0",
]
# Optional vector-search retrieval (deprecated llm_registry_path / embeddings path).
llm-chroma = [
    "openai>=1.0.0",
    "chromadb>=0.4.0",
]
# Metadata catalog integrations.
datahub = ["acryl-datahub[datahub-rest]>=0.12.0"]
openmetadata = []
# Development and testing.
dev = [
    "pytest>=7.4.0",
    "pytest-cov",
    "pytest-mock",
    "ruff",
    "mypy",
    "build",
    "httpx",
]
# Everything except dev tooling.
all = [
    "pyarrow>=10.0",
    "pyorc",
    "xlrd>=2.0",
    "openpyxl>=3.0",
    "lxml>=4.9",
    "lz4",
    "zstandard",
    "brotli",
    "brotli_file",
    "pymongo>=4.6",
    "duckdb>=0.9",
    "duckdb-engine>=0.9",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "mcp>=2.0,<3",
    "anthropic>=2.0",
    "acryl-datahub[datahub-rest]>=0.12.0",
]

[project.urls]
Homepage = "https://github.com/apicrafter/metacrafter/"
Documentation = "https://apicrafter.github.io/metacrafter/"
Repository = "https://github.com/apicrafter/metacrafter/"

[project.scripts]
metacrafter = "metacrafter.__main__:main"

[tool.setuptools.packages.find]
include = ["metacrafter", "metacrafter.*"]
exclude = ["tests", "tests.*"]

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.package-data]
metacrafter = ["rules/schema/*.json"]

[tool.ruff]
line-length = 127
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
