name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Report every Python version instead of cancelling the rest on the first failure.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install ecosystem packages pinned in ecosystem.lock
        run: |
          python -m pip install --upgrade pip pyyaml
          pip install "$(python scripts/ecosystem_ref.py metacrafter-rules)"
          pip install "$(python scripts/ecosystem_ref.py metacrafter-registry)"
      - name: Install package with test extras
        run: pip install -e '.[dev,llm,llm-chroma,mongodb,duckdb,server,mcp,formats]'
      - name: Run tests
        run: pytest tests/ --cov=metacrafter --cov-report=xml --cov-report=term --cov-fail-under=60

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install tools
        run: |
          python -m pip install --upgrade pip pyyaml
          pip install "$(python scripts/ecosystem_ref.py metacrafter-rules)"
          pip install -e '.[dev]' types-PyYAML types-requests
      - name: Lint (syntax errors and undefined names block merge)
        run: ruff check metacrafter tests scripts --select E9,F63,F7,F82
      - name: Type check shared contracts
        run: mypy metacrafter/reports.py metacrafter/sampling.py metacrafter/privacy.py metacrafter/integrations/outcomes.py --follow-imports=silent --ignore-missing-imports --check-untyped-defs

  installation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extras: ["core", "llm", "catalogs"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build pyyaml
          python -m build
      - name: Install built wheel into a clean environment
        env:
          EXTRAS: ${{ matrix.extras }}
        run: |
          python -m venv /tmp/install-check
          /tmp/install-check/bin/pip install "$(python scripts/ecosystem_ref.py metacrafter-rules)"
          WHEEL_PATH=$(realpath dist/*.whl)
          case "$EXTRAS" in
            core) /tmp/install-check/bin/pip install "$WHEEL_PATH" ;;
            llm) /tmp/install-check/bin/pip install "$WHEEL_PATH[llm]" ;;
            catalogs) /tmp/install-check/bin/pip install "$WHEEL_PATH[datahub,openmetadata]" ;;
          esac
      - name: Verify installed resources outside the checkout
        run: |
          cp scripts/check_installation.py /tmp/check_installation.py
          cd /tmp
          /tmp/install-check/bin/python check_installation.py

  ecosystem:
    # Contract with the pinned metacrafter-rules and metacrafter-registry (ecosystem.lock).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Read pinned registry ref
        id: lock
        run: |
          python -m pip install --upgrade pip pyyaml
          echo "registry_ref=$(python -c "import yaml;print(yaml.safe_load(open('ecosystem.lock'))['metacrafter-registry']['ref'])")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: apicrafter/metacrafter-registry
          ref: ${{ steps.lock.outputs.registry_ref }}
          path: metacrafter-registry
      - name: Install
        run: |
          pip install "$(python scripts/ecosystem_ref.py metacrafter-rules)"
          pip install ./metacrafter-registry
          pip install -e '.[dev]'
      - name: Rule keys resolve to registry ids (known exceptions listed in tests/ecosystem)
        run: |
          metacrafter rules check --registry --strict \
            --registry-path metacrafter-registry/data --registry-offline \
            --allow-unknown tests/ecosystem/known_unresolved_rule_keys.yaml
      - name: Rules on registry examples (thresholds in tests/ecosystem)
        run: |
          metacrafter rules test --registry-examples \
            --registry-path metacrafter-registry/data \
            --thresholds tests/ecosystem/rule_thresholds.yaml \
            -o ecosystem-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ecosystem-results
          path: ecosystem-results.json
          if-no-files-found: ignore
