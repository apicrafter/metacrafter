name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Report every Python version instead of cancelling the rest on the first failure.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install ecosystem packages pinned in ecosystem.lock
        run: |
          python -m pip install --upgrade pip pyyaml
          pip install "$(python scripts/ecosystem_ref.py metacrafter-rules)"
          pip install "$(python scripts/ecosystem_ref.py metacrafter-registry)"
      - name: Install package with test extras
        run: pip install -e '.[dev,llm,mongodb,duckdb,server,formats]'
      - name: Run tests
        run: pytest tests/ --cov=metacrafter --cov-report=xml --cov-report=term --cov-fail-under=60

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install tools
        run: |
          python -m pip install --upgrade pip pyyaml
          pip install "$(python scripts/ecosystem_ref.py metacrafter-rules)"
          pip install -e '.[dev]' types-PyYAML types-requests
      - name: Lint (syntax errors and undefined names block merge)
        run: ruff check metacrafter tests scripts --select E9,F63,F7,F82
      - name: Type check shared contracts
        run: mypy metacrafter/reports.py metacrafter/sampling.py metacrafter/privacy.py metacrafter/integrations/outcomes.py --follow-imports=silent --ignore-missing-imports --check-untyped-defs

  installation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extras: ["core", "llm", "catalogs"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build pyyaml
          python -m build
      - name: Install built wheel into a clean environment
        env:
          EXTRAS: ${{ matrix.extras }}
        run: |
          python -m venv /tmp/install-check
          /tmp/install-check/bin/pip install "$(python scripts/ecosystem_ref.py metacrafter-rules)"
          WHEEL_PATH=$(realpath dist/*.whl)
          case "$EXTRAS" in
            core) /tmp/install-check/bin/pip install "$WHEEL_PATH" ;;
            llm) /tmp/install-check/bin/pip install "$WHEEL_PATH[llm]" ;;
            catalogs) /tmp/install-check/bin/pip install "$WHEEL_PATH[datahub,openmetadata]" ;;
          esac
      - name: Verify installed resources outside the checkout
        run: |
          cp scripts/check_installation.py /tmp/check_installation.py
          cd /tmp
          /tmp/install-check/bin/python check_installation.py
