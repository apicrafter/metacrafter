name: Ecosystem compatibility

# Weekly check of metacrafter against the current HEAD of metacrafter-rules and the live
# registry website. On failure, one tracking issue is opened or updated.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: apicrafter/metacrafter-rules
          path: metacrafter-rules
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Download the registry snapshot
        run: metacrafter registry fetch --to registry-snapshot
      - name: Checks against rules HEAD and the live registry
        id: gate
        continue-on-error: true
        env:
          METACRAFTER_RULES_DIR: metacrafter-rules
        run: python scripts/ecosystem_gate.py registry-snapshot --always-block > gate.txt 2>&1
      - name: Open or update the tracking issue
        if: steps.gate.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Weekly ecosystem check failed on $(date -u +%F) (run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})."
            echo
            echo "rules @ $(git -C metacrafter-rules rev-parse --short HEAD), registry $(python -c "import json;m=json.load(open('registry-snapshot/index.json'));print(m.get('version'), m.get('git_sha','')[:7])")"
            echo
            echo '```'; tail -n 80 gate.txt; echo '```'
          } > body.md
          number=$(gh issue list --label ecosystem-drift --state open --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file body.md
          else
            gh label create ecosystem-drift --color B60205 --force >/dev/null 2>&1 || true
            gh issue create --title "Ecosystem drift: rules or registry changed" --label ecosystem-drift --body-file body.md
          fi
      - name: Fail when checks failed
        if: steps.gate.outcome == 'failure'
        run: exit 1
