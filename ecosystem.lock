# Sibling ecosystem data that metacrafter is tested against.
# metacrafter-rules: the default rule pack, this GitHub release. The tag and sha256 must
#   match metacrafter/rules/pack.py (DEFAULT_RELEASE, DEFAULT_SHA256) and the archive in
#   metacrafter/rules/bundled/ (scripts/bundle_rule_pack.py).
# metacrafter-registry: read from its website (/api/v1/). version and git_sha are the
#   registry the baselines in tests/ecosystem/ were recorded against; CI gates block only
#   while the live registry still has this version.
metacrafter-rules:
  repo: apicrafter/metacrafter-rules
  release: v0.0.13
  sha256: 7cdf85e1df2b16d51bd8ee46af31dcfb4502b2e0fa213974320dc5c2e1a1f6f6
metacrafter-registry:
  base_url: https://registry.apicrafter.io
  version: 1.3.0
  git_sha: 2dced6899e6295e8a578f49dd7d942227f63a25d
